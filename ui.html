<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: light;
      font-family: "IBM Plex Sans", "Noto Sans KR", system-ui, sans-serif;
      font-size: 13px;
      color: #1f2937;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #f8fafc;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    p {
      margin: 0 0 12px 0;
      color: #64748b;
      font-size: 12px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5f5;
      border-radius: 8px;
      background: #fff;
      font-size: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row > .field {
      flex: 1;
      margin-bottom: 0;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #64748b;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #0f172a;
      background: #e2e8f0;
      padding: 8px 10px;
      border-radius: 8px;
      min-height: 36px;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .auth-section {
      margin-bottom: 16px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .auth-logged-out, .auth-logged-in, .auth-polling {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-user {
      font-size: 12px;
      color: #16a34a;
      font-weight: 500;
    }
    .auth-hint {
      font-size: 12px;
      color: #64748b;
    }
    .auth-polling-text {
      font-size: 12px;
      color: #d97706;
    }
    button.small {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>QA Annotation Sync</h1>
  <p>QA 카테고리 annotation을 GitHub Issues로 전송합니다.</p>

  <div class="auth-section" id="auth-section">
    <div class="auth-logged-out" id="auth-logged-out">
      <span class="auth-hint">GitHub에 로그인하지 않음</span>
      <button id="login-btn" class="secondary small">로그인</button>
    </div>
    <div class="auth-logged-in" id="auth-logged-in" style="display: none;">
      <span class="auth-user" id="auth-user">@username</span>
      <button id="logout-btn" class="secondary small">로그아웃</button>
    </div>
    <div class="auth-polling" id="auth-polling" style="display: none;">
      <span class="auth-polling-text">GitHub 인증 대기 중...</span>
    </div>
  </div>

  <div class="field">
    <label for="endpoint">Vercel Endpoint URL</label>
    <input id="endpoint" type="text" placeholder="https://your-app.vercel.app/api/qa-issues" />
  </div>

  <div class="row">
    <div class="field">
      <label for="owner">GitHub Owner</label>
      <input id="owner" type="text" placeholder="owner" />
    </div>
    <div class="field">
      <label for="repo">GitHub Repo</label>
      <input id="repo" type="text" placeholder="repo" />
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="label">Issue Label</label>
      <input id="label" type="text" placeholder="QA" />
    </div>
    <div class="field">
      <label for="secret">Sync Secret (옵션)</label>
      <input id="secret" type="text" placeholder="optional" />
    </div>
  </div>

  <div class="field">
    <label for="fileKey">Figma File URL/Key (필요시)</label>
    <input id="fileKey" type="text" placeholder="https://www.figma.com/file/FILEKEY/..." />
    <div class="hint">Private plugin이 아니면 fileKey를 입력해야 링크를 만들 수 있습니다.</div>
  </div>

  <label class="checkbox">
    <input id="scanAllPages" type="checkbox" />
    모든 페이지 스캔
  </label>

  <label class="checkbox">
    <input id="skipSynced" type="checkbox" checked />
    이미 전송된 annotation 건너뛰기
  </label>

  <button id="sync">Sync QA Annotations</button>
  <div class="row" style="margin-top: 8px;">
    <button id="view" class="secondary">View Synced</button>
    <button id="reset" class="secondary">Reset Synced</button>
  </div>

  <div class="status" id="status">대기 중...</div>

  <script>
    const endpointInput = document.getElementById('endpoint');
    const ownerInput = document.getElementById('owner');
    const repoInput = document.getElementById('repo');
    const labelInput = document.getElementById('label');
    const secretInput = document.getElementById('secret');
    const fileKeyInput = document.getElementById('fileKey');
    const scanAllPagesInput = document.getElementById('scanAllPages');
    const skipSyncedInput = document.getElementById('skipSynced');
    const statusEl = document.getElementById('status');
    const syncButton = document.getElementById('sync');
    const viewButton = document.getElementById('view');
    const resetButton = document.getElementById('reset');

    // Auth elements
    const authLoggedOut = document.getElementById('auth-logged-out');
    const authLoggedIn = document.getElementById('auth-logged-in');
    const authPolling = document.getElementById('auth-polling');
    const authUser = document.getElementById('auth-user');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    let currentSessionId = null;
    let pollingInterval = null;

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.style.background = isError ? '#fee2e2' : '#e2e8f0';
      statusEl.style.color = isError ? '#b91c1c' : '#0f172a';
    }

    function setBusy(isBusy) {
      syncButton.disabled = isBusy;
      viewButton.disabled = isBusy;
      resetButton.disabled = isBusy;
    }

    function readSettings() {
      return {
        endpoint: endpointInput.value,
        owner: ownerInput.value,
        repo: repoInput.value,
        label: labelInput.value,
        secret: secretInput.value,
        fileKeyInput: fileKeyInput.value,
        scanAllPages: scanAllPagesInput.checked,
        skipSynced: skipSyncedInput.checked
      };
    }

    syncButton.onclick = () => {
      setBusy(true);
      setStatus('전송 요청 중...', false);
      parent.postMessage({ pluginMessage: { type: 'sync-qa', settings: readSettings() } }, '*');
    };

    viewButton.onclick = () => {
      setBusy(true);
      setStatus('전송 기록 확인 중...', false);
      parent.postMessage({ pluginMessage: { type: 'view-synced', settings: readSettings() } }, '*');
    };

    resetButton.onclick = () => {
      if (!confirm('전송 기록을 초기화할까요?')) return;
      setBusy(true);
      setStatus('전송 기록 초기화 중...', false);
      parent.postMessage({ pluginMessage: { type: 'reset-synced', settings: readSettings() } }, '*');
    };

    // Auth handlers
    loginBtn.onclick = () => {
      setStatus('로그인 시작...', false);
      parent.postMessage({ pluginMessage: { type: 'start-login', settings: readSettings() } }, '*');
    };

    logoutBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'logout', settings: readSettings() } }, '*');
    };

    function showAuthState(state, user) {
      authLoggedOut.style.display = state === 'logged-out' ? 'flex' : 'none';
      authLoggedIn.style.display = state === 'logged-in' ? 'flex' : 'none';
      authPolling.style.display = state === 'polling' ? 'flex' : 'none';
      if (user) {
        authUser.textContent = '@' + user;
      }
    }

    function startPolling(endpoint, state) {
      showAuthState('polling');
      if (pollingInterval) clearInterval(pollingInterval);

      pollingInterval = setInterval(async () => {
        try {
          const res = await fetch(endpoint + '/api/auth/status?state=' + state);
          const data = await res.json();
          if (data.authenticated && data.sessionId) {
            clearInterval(pollingInterval);
            pollingInterval = null;
            currentSessionId = data.sessionId;
            parent.postMessage({ pluginMessage: { type: 'save-session', sessionId: data.sessionId } }, '*');
            showAuthState('logged-in', data.user?.login);
            setStatus('GitHub 로그인 완료!', false);
          }
        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 3000);

      // Stop polling after 5 minutes
      setTimeout(() => {
        if (pollingInterval) {
          clearInterval(pollingInterval);
          pollingInterval = null;
          showAuthState('logged-out');
          setStatus('로그인 시간 초과. 다시 시도해주세요.', true);
        }
      }, 300000);
    }

    async function checkAuthStatus(sessionId) {
      if (!sessionId) {
        showAuthState('logged-out');
        return;
      }
      const endpoint = endpointInput.value.replace(/\/api\/qa-issues\/?$/, '');
      if (!endpoint) {
        showAuthState('logged-out');
        return;
      }
      try {
        const res = await fetch(endpoint + '/api/auth/status', {
          headers: { 'X-QA-Session': sessionId }
        });
        const data = await res.json();
        if (data.authenticated) {
          currentSessionId = sessionId;
          showAuthState('logged-in', data.user?.login);
        } else {
          showAuthState('logged-out');
        }
      } catch (err) {
        console.error('Auth check error:', err);
        showAuthState('logged-out');
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'settings') {
        const settings = msg.settings || {};
        endpointInput.value = settings.endpoint || '';
        ownerInput.value = settings.owner || '';
        repoInput.value = settings.repo || '';
        labelInput.value = settings.label || 'QA';
        secretInput.value = settings.secret || '';
        fileKeyInput.value = settings.fileKeyInput || '';
        scanAllPagesInput.checked = Boolean(settings.scanAllPages);
        skipSyncedInput.checked = settings.skipSynced !== false;
        // Check auth status with saved session
        if (msg.sessionId) {
          checkAuthStatus(msg.sessionId);
        }
      }

      if (msg.type === 'auth-status-check') {
        checkAuthStatus(msg.sessionId);
      }

      if (msg.type === 'open-auth') {
        const endpoint = msg.endpoint;
        setStatus('인증 서버 연결 중: ' + endpoint, false);
        fetch(endpoint + '/api/auth/login')
          .then(res => res.json())
          .then(data => {
            if (data.authUrl && data.state) {
              setStatus('브라우저에서 GitHub 인증을 완료해주세요.', false);
              parent.postMessage({ pluginMessage: { type: 'open-external', url: data.authUrl } }, '*');
              startPolling(endpoint, data.state);
            } else {
              setStatus('로그인 URL을 가져올 수 없습니다: ' + JSON.stringify(data), true);
            }
          })
          .catch(err => {
            setStatus('로그인 요청 실패: ' + err.message, true);
          });
      }

      if (msg.type === 'auth-saved') {
        // Session saved, auth complete
      }

      if (msg.type === 'do-logout') {
        const { endpoint, sessionId } = msg;
        if (endpoint && sessionId) {
          fetch(endpoint + '/api/auth/logout', {
            method: 'POST',
            headers: { 'X-QA-Session': sessionId }
          }).catch(() => {});
        }
        currentSessionId = null;
        showAuthState('logged-out');
        setStatus('로그아웃 완료', false);
      }

      if (msg.type === 'progress') {
        setBusy(true);
        setStatus(msg.message, false);
      }

      if (msg.type === 'done' || msg.type === 'empty') {
        setStatus(msg.message, false);
        setBusy(false);
      }

      if (msg.type === 'error') {
        setStatus(msg.message, true);
        setBusy(false);
      }
    };

    parent.postMessage({ pluginMessage: { type: 'get-settings' } }, '*');
  </script>
</body>
</html>
